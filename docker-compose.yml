services:
  ai-service:
    build:
      context: .
      dockerfile: ai-models/service/Dockerfile
    container_name: stroke-ai-service
    ports:
      - "${PORT_AI:-8001}:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [stroke-net]

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: stroke-backend
    ports:
      - "${PORT_BE:-8000}:8000"
    environment:
      PORT_BE: 8000
      AI_SERVICE_URL: http://ai-service:8001
      MONGODB_URI: ${MONGODB_URI}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      ai-service:
        condition: service_healthy
    restart: unless-stopped
    networks: [stroke-net]

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: stroke-frontend
    ports:
      - "${PORT_FE:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks: [stroke-net]

networks:
  stroke-net:
    driver: bridge